# ヤフオク入札判断ツールの設定
# 数値は自分の実績に合わせて調整してください。

[fx]
# 1 USD = 何円で計算するか（--fx で上書き可。auto_fetch=true なら起動時に取得を試みる）
usd_jpy = 150.0
auto_fetch = true
# 円転時の為替手数料・目減り（Payoneer等）
conversion_loss_pct = 2.0

[ebay]
# 落札手数料（Final Value Fee）: ebay売上シートの実績では 送料・税込み額の 10.3%（レンズ等）〜13.4%。
# 買い手の税にも掛かるため、商品＋送料に対する実効率として 12% で計算
# 2026-11-14 eBay API の実績は 11.15%。保守的に 12% のまま
final_value_fee_pct = 12.0
# 1注文あたりの固定手数料（USD）
per_order_fee_usd = 0.44
# 海外決済手数料（International fee）。2026-11-14 eBay API の実績 1.55% に合わせて 1.45→1.55
international_fee_pct = 1.55
# 広告（Promoted Listings）の率。2026-11-14 eBay API の実績は 1.02%。広告を増やす余地を残し 2.2% のまま
ad_rate_pct = 2.2
# 手数料は「商品価格＋買い手負担送料」に掛かる。買い手から受け取る送料（USD）
buyer_shipping_usd = 0.0

[shipping]
# 販売価格から一律で差し引く国際送料（USD）。0なら下の円建てサイズ別を使う。入札判断（appraise.py・拡張機能・店舗アプリ）で使う
# 2026-11-15 30→40（ユーザー決定）。今から仕入れる商品は次の出品から送料 $40 を乗せて出すため。
# 実績: CPaSS の送料 約¥4,600＋オークレボの手数料 約¥740〜820 ＝ 1件 約$36（FedEx の月は別に送料あり）
deduction_usd = 40.0
# 出品中・販売済みの商品（出品に送料 $30 を乗せていた頃）の送料の見積もり。数字のグラフ（build_dashboard.py）で使う
listed_deduction_usd = 30.0
# 国際送料（円）。--ship で品目ごとに上書き可。サイズ別の目安
default_jpy = 3500
small_jpy = 2500     # レンズ・コンパクト等
medium_jpy = 3500    # 一眼ボディ等
large_jpy = 6000     # 中判・セット品等
# 梱包資材など
packing_jpy = 300

[yahoo]
# ヤフオク側の国内送料が不明なときの仮置き（円）
default_domestic_shipping_jpy = 1000
# ストア出品の消費税率（%）。ストアは入札額が税抜で、支払いは入札額×(1+税率)。個人出品には掛からない
store_tax_pct = 10.0

[tax]
# 輸出免税による消費税還付を利益に含めるか（課税事業者のみ）
include_consumption_tax_refund = false
consumption_tax_pct = 10.0

[judge]
# 入札判断の基準（全体統一。2026-11-17 ユーザー決定: 落札を増やすため 利益 2,000円以上 かつ 利益率（売上に対する割合）8%以上に下げた。前は 2,500円・10%）
min_profit_jpy = 2000
min_margin_pct = 8.0
# 想定販売価格に使うeBay販売済み価格の分位（0.5=中央値。保守的にするなら 0.4 など）
sold_price_quantile = 0.5
# ジャンク表記の出品は想定販売価格をこの割合で見る（1.0で割引なし）。中判など動くことが多い品が多ければ上げる
junk_price_factor = 1.0  # 2026-11-16 ユーザー指定: ジャンクも割り引かない（7割評価をやめた）
# 状態の補正: 過去データの状態とこの出品の状態が1ランク違うごとに、販売価格を何ドル動かすか（0で補正しない）
# ランク: Unused > TOP MINT > MINT > Almost MINT > Near MINT > Exc+5 > … > Exc（2026-11-15 ユーザー指定。［直す］で選べるのは Exc+5 まで）。出品の状態はヤフオクの商品名の日本語（美品など）から。表記なしは Near MINT
# 2026-11-18 ユーザー決定（おまかせ）: 固定額（1ランク $10）をやめ、価格に対する割合にした。実績（自分・Chatwork の販売実績のうち、
# 同じ機種で状態の違う組）から1ランクあたりの%を毎回推定する（3〜15%の範囲。組が5つ未満なら下の値）
condition_step_pct = 8.0
condition_step_auto = true
# 安心枠（フォロー中のストア＝安心ストア）の基準。全体統一（[judge] と同じ値にする）
trusted_min_profit_jpy = 2000
trusted_min_margin_pct = 8.0
# eBay 出品中の最安値から仮の相場を出すとき、送料無料の出品は出品額からこの額（USD）を引いた額を商品代（送料別）とみなす。
# 送料を別に取っている出品は出品額（商品代）をそのまま使う（2026-11-16 ユーザー決定）
active_free_ship_deduction_usd = 30.0
