# ヤフオク入札判断ツールの設定
# 数値は自分の実績に合わせて調整してください。

[fx]
# 1 USD = 何円で計算するか（--fx で上書き可。auto_fetch=true なら起動時に取得を試みる）
usd_jpy = 150.0
auto_fetch = true
# 円転時の為替手数料・目減り（Payoneer等）
conversion_loss_pct = 2.0

[ebay]
# 落札手数料（Final Value Fee）: ebay売上シートの実績では 送料・税込み額の 10.3%（レンズ等）〜13.4%。
# 買い手の税にも掛かるため、商品＋送料に対する実効率として 12% で計算
# 2026-11-14 eBay API の実績は 11.15%。保守的に 12% のまま
final_value_fee_pct = 12.0
# 1注文あたりの固定手数料（USD）
per_order_fee_usd = 0.44
# 海外決済手数料（International fee）。2026-11-14 eBay API の実績 1.55% に合わせて 1.45→1.55
international_fee_pct = 1.55
# 広告（Promoted Listings）の率。2026-11-14 eBay API の実績は 1.02%。広告を増やす余地を残し 2.2% のまま
ad_rate_pct = 2.2
# 手数料は「商品価格＋買い手負担送料」に掛かる。買い手から受け取る送料（USD）
buyer_shipping_usd = 0.0

[shipping]
# 販売価格から一律で差し引く国際送料（USD）。0なら下の円建てサイズ別を使う。入札判断（appraise.py・拡張機能・店舗アプリ）で使う
# 2026-11-15 30→40（ユーザー決定）。今から仕入れる商品は次の出品から送料 $40 を乗せて出すため。
# 実績: CPaSS の送料 約¥4,600＋オークレボの手数料 約¥740〜820 ＝ 1件 約$36（FedEx の月は別に送料あり）
deduction_usd = 40.0
# Chatwork（スクールの販売報告）の販売価格に含まれている送料（スクールの方針でだいたい $30）。商品代＝価格 − この額（2026-11-18 ユーザー決定）
chatwork_included_usd = 30.0
# 出品中・販売済みの商品（出品に送料 $30 を乗せていた頃）の送料の見積もり。数字のグラフ（build_dashboard.py）で使う
listed_deduction_usd = 30.0
# 国際送料（円）。--ship で品目ごとに上書き可。サイズ別の目安
default_jpy = 3500
small_jpy = 2500     # レンズ・コンパクト等
medium_jpy = 3500    # 一眼ボディ等
large_jpy = 6000     # 中判・セット品等
# 梱包資材など
packing_jpy = 300

[yahoo]
# ヤフオク側の国内送料が不明なときの仮置き（円）
default_domestic_shipping_jpy = 1000
# ストア出品の消費税率（%）。ストアは入札額が税抜で、支払いは入札額×(1+税率)。個人出品には掛からない
store_tax_pct = 10.0

[tax]
# 輸出免税による消費税還付を利益に含めるか（課税事業者のみ）
include_consumption_tax_refund = false
consumption_tax_pct = 10.0

[judge]
# 入札判断の基準（全体統一。2026-11-17 ユーザー決定: 落札を増やすため 利益 2,000円以上 かつ 利益率（売上に対する割合）8%以上に下げた。前は 2,500円・10%）
min_profit_jpy = 2000
min_margin_pct = 8.0
# 安い物の基準（2026-11-19 ユーザー決定）: 売値（送料込み）が low_price_usd 以下の物は、利益の基準を low_price_min_profit_jpy に上げる。
# 実績79件で $99以下の37件は1件平均344円しか残らなかった（返金・送料・手数料で消える）ため。利益率の基準は同じ
low_price_usd = 99.0
low_price_min_profit_jpy = 4000
# 想定販売価格に使うeBay販売済み価格の分位（0.5=中央値。保守的にするなら 0.4 など）
sold_price_quantile = 0.5
# ジャンク表記の出品は想定販売価格をこの割合で見る（1.0で割引なし）。中判など動くことが多い品が多ければ上げる
junk_price_factor = 1.0  # 2026-11-16 ユーザー指定: ジャンクも割り引かない（7割評価をやめた）
# 状態の補正: 過去データの状態とこの出品の状態が1ランク違うごとに、販売価格を何ドル動かすか（0で補正しない）
# ランク: Unused > TOP MINT > MINT > Almost MINT > Near MINT > Exc+5 > … > Exc（2026-11-15 ユーザー指定。［直す］で選べるのは Exc+5 まで）。出品の状態はヤフオクの商品名の日本語（美品など）から。表記なしは Near MINT
# 2026-11-18 ユーザー決定（おまかせ）: 固定額（1ランク $10）をやめ、価格に対する割合にした。実績（自分・Chatwork の販売実績のうち、
# 同じ機種で状態の違う組）から1ランクあたりの%を毎回推定する（3〜15%の範囲。組が5つ未満なら下の値）
condition_step_pct = 8.0
condition_step_auto = true
# 安心枠（フォロー中のストア＝安心ストア）の基準。全体統一（[judge] と同じ値にする）
trusted_min_profit_jpy = 2000
trusted_min_margin_pct = 8.0
# eBay 出品中の最安値から仮の相場を出すとき、送料無料の出品は出品額からこの額（USD）を引いた額を商品代（送料別）とみなす。
# 送料を別に取っている出品は出品額（商品代）をそのまま使う（2026-11-16 ユーザー決定）
active_free_ship_deduction_usd = 30.0
# 仮の相場の「案」にする最安値の下限（送料別の商品代$）。送料無料の出品は −$30 するので、$30 以下の出品は 0 以下になる。
# 0 以下の案（「案 $-1」「案 $-20」）は出さない（2026-11-19 監査）。付属品などの安い誤ヒットも外すため、送料別 $20 未満は案にしない（2026-11-19 ユーザー決定）
suggest_min_net_usd = 20.0

[yahoo_results]
# 落札相場の記録（tools/yahoo_results.py。2026-11-19 ユーザー「いくらで落札されたかのデータが重要」）。判定・上限額には使わない
# 毎朝読むヤフオクの出品ページの上限件数（残りは次の朝）と間隔（秒。1.5 未満にはしない）
max_checks = 300
delay_sec = 1.5
# 拡張機能・古物台帳「Mac_落札相場」に出す期間（日）
market_days = 90
# 拡張機能が1日に見張りリスト（ダウンロード/aurora_seen.csv）へ足す上限件数
seen_max_per_day = 300
# 入札した出品が古物台帳に載るのを待つ日数（終了から）。過ぎても台帳に無ければ「負け」（入札結果）
ledger_wait_days = 10

[yahoo_search]
# 毎朝の入札リストでヤフオクの検索ページを読むときの決まり（2026-11-19 ユーザー決定: robots.txt に合わせる）
# 並べ替え（s1・o1）・件数（n）など robots.txt で Disallow の引数は外して読む（tools/robots.py が読む前に検査）。1ページの件数はヤフオクの既定
# 1回に読む検索ページの合計の上限と、ページの間隔（秒。1.5 未満にはしない）
max_pages_total = 300
delay_sec = 1.5

[win_score]
# 勝ちやすさ（tools/win_score.py。2026-11-19 ユーザー決定）: ヤフオクの終わった出品のうち、今の上限入札額以下で終わった割合（機種ごと）
# この割合未満の機種は入札リスト・拡張機能の下に回す（判定・上限額・利益の基準は変えない）
low_rate = 0.10
# 割合を出す・表示するのに要る件数（これ未満の機種は今の並び・表示なし）
min_samples = 5
# 1回（毎朝）に調べる機種数・1機種に読むページ数・間隔（秒。1.5 未満にはしない）・同じ機種を調べ直す日数・数える期間（日）
max_models = 30
pages_per_model = 2
delay_sec = 3.0
refresh_days = 7
lookback_days = 90
# 予約リストで、勝ちやすさの記録が無い機種に使う割合（提案書: 全体で約2割）
default_rate = 0.2

[caution]
# 注意を出す出品者（2026-11-19 ユーザー決定「注意書きだけ出す」）: 出品者の表示名にこの語が入っていれば、
# 拡張機能・入札リスト・予約リストの行に注意を出す。判定・上限額・並びは変えない
sellers = ["バイセル"]
note = "過去にこのストアから仕入れた品は、今の出品価格だと赤字の見込み。sold と状態をよく確かめてから"

[reserve]
# 今日の予約リスト（2026-11-19 ユーザー決定）: 1日に予約する本数の目標と、対象にする終了日（今日から何日分。2＝今日〜明日）
# 1日の予約額の合計には上限を付けない（ユーザー決定）
target = 8
days = 2

[realized]
# 実績の売値（2026-11-20 ユーザー決定「まず表示だけ」）: ヤフオクで落札した物は、入札したときの eBay 見込み（送料別）に対して
# 実際はこの割合で売れていた（落札73件・返金を除く47件の中央値）。上限額で落札して、この割合で売れたときの利益を表示するだけ。
# 判定・上限入札額・並びには使わない。商品名に MINT 以上の語がある出品は mint の割合（届いて MINT 以上だった物の実績）
mint = 0.96
under_100 = 0.58
under_200 = 0.76
over_200 = 0.87
